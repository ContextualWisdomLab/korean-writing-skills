name: PR 29 exact-head Python 3.14 validation
on:
  push:
    branches: [ci/pr29-python314-validation-20261108]
permissions:
  contents: read
concurrency:
  group: pr29-exact-head-python314
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, cwlab-ci-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout PR 29 exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: 092623100897d21f3eeb58a0c25714237ff6af3d
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.7"
          enable-cache: false
      - name: Verify exact source and Python version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "092623100897d21f3eeb58a0c25714237ff6af3d"
          uv python install 3.14
          uv sync --locked --python 3.14
          uv run --locked python -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 14)'
      - name: Run full repository tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v
          uv run --locked python tests/skill_structure_test.py
          uv run --locked python tests/source_traceability_test.py
          bash tests/public_hygiene_test.sh
          git diff --check e6eda1432b938f0fa359e30aa35a225bc7276628 HEAD
